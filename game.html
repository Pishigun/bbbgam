<!DOCTYPE html>
<head>
    <title>bbbgam</title>
    <style>

        #player {
            width: 20px;
            height: 20px;
            background-color: black;
            position: absolute;
        }
        #block{
            width: 30px;
            height: 30px;
            background-color: black;
            position: fixed;
            left: 300px;
            top: 300px;
        }
        #staminabar {
            width: 100px;
            height: 20px;
            background-color: blue;
            border: 1px solid black;
            position: fixed;
            left: 10px;
            top: 10px;
        }
        #staminaholder {
            width: 100px;
            height: 20px;
            background-color: white;
            border: 1px solid black;
            position: fixed;
            left: 10px;
            top: 10px;
        }
        #debuffeffect {
            width: 30px;
            height: 30px;
            background-color: orange;
            opacity: 0;
            position: absolute;
        }
    </style>
</head>
<body>

    <div id="player"></div>
    <div id="int"></div>
    <div id="staminaholder"></div>
    <div id="staminabar"></div>
    <div id="block"></div>
    <div id="debuffeffect"></div>

    <script>
        const player = document.getElementById('player');

        const block = document.getElementById('block');

        const staminabar = document.getElementById('staminabar');

        const staminaholder = document.getElementById('staminaholder');

        const debuffeffect = document.getElementById('debuffeffect');

        const keys = {};

        let epress = false;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true
            if (e.key === "e") {
                epress = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (e.key === "e") {
                epress = false;
            }
            });

        let x = 0;
        let y = 0;
        let tp = 200;
        let tpcd = 0;
        let stamina = 100;
        let direction = null;
        let debufftimer = null;
        let speed = 8;

       const staminagain = setInterval(() => {
        stamina = Math.min(100, stamina + 4);
        }, 1000);

     function isColliding(a, b) {
    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return (
        rect1.left < rect2.right &&
        rect1.right > rect2.left &&
        rect1.top < rect2.bottom &&
        rect1.bottom > rect2.top
    );
}

        function gameLoop() {
            if (keys["w"]){
                y -= speed;
                direction = "up";
            }
            if (keys["s"]){
                y += speed;
                direction = "down";
            }
            if (keys["a"]){
                x -= speed;
                direction = "left";
            }
            if (keys["d"]){
                x += speed;
                direction = "right";
            }
            if (keys["e"]) {
                if (epress) {
                    if (tpcd === 0 && stamina >= 10 && direction !== null) {

                    if (direction === "up") y -= tp;
                    else if (direction === "down") y += tp;
                    else if (direction === "left") x -= tp;
                    else if (direction === "right") x += tp;

                    stamina -= 10;
                    tpcd = 1;

                    setTimeout(() => {
                    tpcd = 0;
                    }, 200);
                    }

                    epress = false;
                    }}

            x = Math.max(0, Math.min(x, window.innerWidth - 20));
            y = Math.max(0, Math.min(y, window.innerHeight - 20));
            
            player.style.left = x + 'px';
            player.style.top = y + 'px';
            debuffeffect.style.left = x - 5 + 'px';
            debuffeffect.style.top = y - 5 + 'px';
            staminabar.style.width = stamina + 'px';

            if (isColliding(player, block)) {

    speed = 4;
    debuffeffect.style.opacity = 0.5;

    clearTimeout(debufftimer);

    debufftimer = setTimeout(() => {
        speed = 8;
        debuffeffect.style.opacity = 0;
    }, 3000);

} 

            requestAnimationFrame(gameLoop);
        }
        function startGame() {
            gameLoop();
        }

        startGame();
        
    </script>
     
</body>
</html>
